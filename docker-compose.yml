services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: secdocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secdocs_dev_pass}
      POSTGRES_DB: secdocs
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U secdocs -d secdocs"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://secdocs:${POSTGRES_PASSWORD:-secdocs_dev_pass}@db:5432/secdocs
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
